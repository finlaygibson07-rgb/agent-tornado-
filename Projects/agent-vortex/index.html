/* ---------- CHANNEL inputs ---------- */

function pick(mx, my) {
  let best = null, bd = 1e9;
  for (const a of agents) {
    const d = Math.hypot(a._x - mx, a._y - my);
    const reach = Math.max(9, a._r * 3.2);
    if (d < reach && d < bd) { bd = d; best = a; }
  }
  return best;
}

cv.addEventListener('mousemove', e => {
  const now = performance.now();
  const elapsed = Math.max(16, now - channelState.pointer.at);
  if (channelState.pointer.at) {
    channelState.wind.x = clamp((e.clientX - channelState.pointer.x) / elapsed * 8, -1, 1);
    channelState.wind.y = clamp((e.clientY - channelState.pointer.y) / elapsed * 8, -1, 1);
  }
  channelState.pointer.x = e.clientX; channelState.pointer.y = e.clientY; channelState.pointer.at = now;
  document.documentElement.style.setProperty('--wind-x', ((e.clientX / W) - .5).toFixed(3));
  document.documentElement.style.setProperty('--wind-y', ((e.clientY / H) - .5).toFixed(3));
  hovered = pick(e.clientX, e.clientY);
  cv.style.cursor = hovered ? 'pointer' : 'default';
  if (hovered) {
    ui.tip.textContent = hovered.name + '  ' + hovered.fit.toFixed(2);
    ui.tip.style.left = hovered._x + 'px';
    ui.tip.style.top = hovered._y + 'px';
    ui.tip.classList.add('on');
  } else {
    ui.tip.classList.remove('on');
  }
});
cv.addEventListener('mouseleave', () => { hovered = null; ui.tip.classList.remove('on'); });

cv.addEventListener('click', e => {
  const hit = pick(e.clientX, e.clientY);
  select(hit);
  if (hit) { focusCohort = hit.cohort; renderRail(); }
});

function lineageOf(a) {
  const bits = [];
  if (a.parent) bits.push('built by ' + a.parent.name);
  const names = [];
  let cur = a.sire, guard = 0;
  while (cur && guard++ < 8) { names.push(cur.name); cur = cur.sire; }
  bits.push(names.length ? 'gen ' + a.gen + ' · ' + names.join(' ← ') : 'gen 1 · founder');
  return bits.join(' · ');
}

function select(a) {
  selected = a || null;
  const box = document.getElementById('inspect');
  if (!a) { box.classList.remove('on'); return; }
  box.classList.add('on');
  const kindEl = document.getElementById('i-kind');
  kindEl.textContent = a.kind + (a.depth ? ' · helper' : '') + (a.core ? ' · protected' : '');
  document.getElementById('i-name').textContent = a.name;
  const bar = document.getElementById('i-bar');
  bar.style.width = (a.fit * 100).toFixed(0) + '%';
  document.getElementById('i-role').textContent = a.role + (a.refined ? '  ✦' : '');
  const lift = helpLift(a);
  document.getElementById('i-fit').textContent =
    a.fit.toFixed(2) + ' of a possible ' + ceiling(a).toFixed(2) +
    (lift > 0.005 ? '  (+' + lift.toFixed(2) + ' from its helpers)' : '');
  document.getElementById('i-runs').textContent =
    a.runs ? a.wins + ' / ' + a.runs + ' runs (' + Math.round(a.wins / a.runs * 100) + '%)' : 'not run yet';
  document.getElementById('i-traits').textContent =
    'precision ' + a.skill.precision.toFixed(2) + ' · speed ' + a.skill.speed.toFixed(2) +
    ' · thrift ' + a.skill.thrift.toFixed(2) +
    (a.builtFor ? '  — built to cover ' + a.builtFor : '');
  const lr = learnRate(a);
  if (lr > 1.01) document.getElementById('i-traits').textContent += '  · learning ×' + lr.toFixed(1);
  document.getElementById('i-lineage').textContent = lineageOf(a);
  document.getElementById('i-index').textContent =
    a.depth
      ? 'orbiting ' + a.parent.name + ' at depth ' + a.depth
      : (orderMode === 'fitness' ? 'ranked ' : 'built ') + ((a.rank || 0) + 1) + ' in the funnel';
  document.getElementById('i-from').textContent = a.cohort.prompt;
  document.getElementById('i-built').textContent = a.cohort.at.toLocaleTimeString() + ' · ' + a.cohort.source;
  const kids = document.getElementById('i-kids');
  kids.innerHTML = '';
  document.getElementById('i-kids-wrap').style.display = a.kids.length ? '' : 'none';
  for (const k of a.kids) {
    if (!agents.includes(k)) continue;
    const el = document.createElement('span');
    el.className = 'chip';
    el.textContent = k.name.split('.').pop();
    el.title = k.role;
    el.onclick = () => select(k);
    kids.appendChild(el);
  }
}

  ui.agents.textContent = live.length;
  ui.epoch.textContent = epoch;      ui.fit.textContent = live.length
        ? (live.reduce((s, a) => s + a.fit, 0) / live.length).toFixed(2).replace(/^0/, '')
        : '—';
      const splitEl = document.getElementById('s-split');
      if (splitEl) splitEl.textContent = live.length
        ? (live.reduce((s, a) => s + splitAmount(a), 0) / live.length).toFixed(2)
        : '0.00';
  ui.flux.textContent = births + ' / ' + deaths;

  const h = genome.history;
  ui.run.textContent = (genome.runs + 1) +
    (h.length ? '  ·  last ' + h[h.length - 1].epochs + 'e' : '');

  const active = cohorts.filter(c => c.clearedEpoch === null && c.work);
  if (!active.length) {
    ui.task.textContent = cleared ? cleared + ' obliterated' : '—';
  } else {
    const d = active.reduce((t, c) => t + c.done, 0);
    const w = active.reduce((t, c) => t + c.work, 0);
    ui.task.textContent = (w ? Math.floor(d / w * 100) : 0) + '%' +
      (cleared ? '  ·  ' + cleared + ' gone' : '');
  }
  const perCohort = new Map();
  for (const a of agents) if (!a.dying) perCohort.set(a.cohort, (perCohort.get(a.cohort) || 0) + 1);
  for (const c of cohorts) {
    if (c._bar) c._bar.style.width = (clamp(c.work ? c.done / c.work : 0, 0, 1) * 100).toFixed(1) + '%';
    if (c._sub && c.clearedEpoch === null) {
      c._sub.textContent = (perCohort.get(c) || 0) + ' alive · ' + c.count + ' built · ' + c.source;
    }
  }
}

function logEvent(text) {
  const row = document.createElement('div');
  row.className = 'ev';
  row.innerHTML = '<b></b><i></i>';
  row.querySelector('b').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' e' + epoch;
  const i = row.querySelector('i');
  i.textContent = text;
  i.title = text;
  ui.log.appendChild(row);
  if (/^(WARN|ALERT|DISCHARGE)\b/.test(text)) {
    const signal = row.cloneNode(true);
    signal.className = 'signal-event';
    ui.signalStrip.appendChild(signal);
    while (ui.signalStrip.childElementCount > 12) ui.signalStrip.removeChild(ui.signalStrip.firstChild);
  }
  while (ui.log.childElementCount > 60) ui.log.removeChild(ui.log.firstChild);
  ui.log.scrollTop = ui.log.scrollHeight;
  ui.signalStrip.scrollTop = ui.signalStrip.scrollHeight;
  ui.event.textContent = 'e' + epoch + '  ' + text;
}

const inboxEl = document.getElementById('inbox');

function placeInbox() {
  const cohortsEl = document.getElementById('cohorts');
  inboxEl.style.bottom = (dockEl.offsetHeight + 30) + 'px';
  if (cohortsEl && window.innerWidth > 900) {
    cohortsEl.style.top = (hudEl.offsetTop + hudEl.offsetHeight + 24) + 'px';
    cohortsEl.style.bottom = (dockEl.offsetHeight + 34) + 'px';
  }
}

function inboxBadge() {
  const n = (genome.reports || []).length;
  document.getElementById('inbox-count').textContent =
    inboxUnread ? inboxUnread + ' new' : (n || '0');
  inboxEl.classList.toggle('unread', inboxUnread > 0);
}

/* a debrief landing must not close the one the user is reading — only fall
   back to the list if the open report has aged out of the kept 20 */
function inboxFiled() {
  inboxUnread++;
  if (inboxOpen !== null && genome.reports.some(r => r.run === inboxOpen)) inboxBadge();
  else renderInbox();
  saveGenome();
}

function renderInbox() {
  const list = document.getElementById('inbox-list');
  const read = document.getElementById('inbox-read');
  read.hidden = true;
  list.hidden = false;
  inboxOpen = null;
  list.innerHTML = '';
  const reps = genome.reports || [];
  inboxBadge();
  if (!reps.length) {
    list.innerHTML = '<div class="ib-empty">no runs finished yet — a debrief lands here when a brief is obliterated</div>';
    return;
  }
  reps.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'ib-row';
    el.innerHTML = '<b></b><s></s>';
    el.querySelector('b').textContent = 'run ' + r.run + ' \u00b7 ' + r.epochs + ' epochs' +
      (r.delta === null ? '' : ' \u00b7 ' + (r.delta <= 0 ? '' : '+') + r.delta + '%');
    const sub = el.querySelector('s');
    sub.textContent = r.prompt;
    sub.title = r.prompt;
    el.onclick = () => openReport(i);
    list.appendChild(el);
  });
}  const REPORT_SECTIONS = [
  ['what went right', 'right'],
  ['what went wrong', 'wrong'],
  ['what to improve', 'improve'],
  ['lessons kept', 'lessons']
];

function openReport(i) {
  const r = (genome.reports || [])[i];
  if (!r) return;
  inboxUnread = 0;
  inboxOpen = r.run;
  const list = document.getElementById('inbox-list');
  const read = document.getElementById('inbox-read');
  list.hidden = true;
  read.hidden = false;
  read.innerHTML = '';

  const back = document.createElement('div');
  back.className = 'ib-back';
  back.textContent = '\u2039 all runs';
  back.onclick = renderInbox;
  read.appendChild(back);

  const meta = document.createElement('div');
  meta.className = 'ib-meta';
  meta.textContent = 'run ' + r.run + ' \u00b7 ' + r.epochs + ' epochs \u00b7 ' +
    r.crew + ' agents \u00b7 peak fit ' + r.peakFit;
  read.appendChild(meta);

  for (const [title, key] of REPORT_SECTIONS) {
    const lines = r[key] || [];
    if (!lines.length) continue;
    const sec = document.createElement('div');
    sec.className = 'ib-sec';
    const h = document.createElement('h4');
    h.textContent = title;
    sec.appendChild(h);
    const ul = document.createElement('ul');
    for (const line of lines) {
      const li = document.createElement('li');
      li.textContent = line;
      ul.appendChild(li);
    }
    sec.appendChild(ul);
    read.appendChild(sec);
  }
  inboxBadge();
}

document.querySelectorAll('#dock-foot details').forEach(group => group.addEventListener('toggle', placeInbox));

document.getElementById('inbox-head').onclick = () => {
  inboxEl.classList.toggle('open');
  if (inboxEl.classList.contains('open')) {
    inboxUnread = 0;
    inboxBadge();
  }
};

function renderRail() {
  ui.list.innerHTML = '';
  if (!cohorts.length) {
    ui.list.innerHTML = '<div class="empty">no agents yet</div>';
    return;
  }
  for (const c of cohorts) {
    const alive = agents.filter(a => a.cohort === c && !a.dying).length;
    const el = document.createElement('div');
    const done = c.clearedEpoch !== null;
    el.className = 'cohort' + (focusCohort === c ? ' on' : '') + (done ? ' done' : '');
    el.innerHTML = '<span class="swatch"></span>' +
      '<span class="cohort-text"><i></i><u></u>' +
      '<span class="prog"><i></i></span></span>';
    el.querySelector('.cohort-text > i').textContent = c.prompt;
    el.querySelector('.cohort-text > i').title = c.prompt;
    c._sub = el.querySelector('u');
    c._sub.textContent = done
      ? 'obliterated in ' + (c.clearedEpoch - c.bornEpoch) + ' epochs'
      : alive + ' alive · ' + c.count + ' built · ' + c.source;
    c._bar = el.querySelector('.prog > i');
    c._bar.style.width = (clamp(c.work ? c.done / c.work : 0, 0, 1) * 100).toFixed(1) + '%';
    el.onclick = () => { focusCohort = focusCohort === c ? null : c; renderRail(); };
    ui.list.appendChild(el);
  }
  ui.list.scrollTop = ui.list.scrollHeight;
}

function note(msg, ms) {
  ui.note.textContent = msg || '';
  if (msg && ms) setTimeout(() => { if (ui.note.textContent === msg) ui.note.textContent = ''; }, ms);
}

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = ui.prompt.value.trim();
  if (!text) return;
  if (livePop() > POP_CAP - 40) { note('population is at the cap — reset first', 4000); return; }

  const useLLM = document.getElementById('use-llm').checked;
  const model = document.getElementById('model').value;

  ui.prompt.value = '';
  ui.build.disabled = true;

  let spec = null, source = 'local';
  if (useLLM && model) {
    note('asking ' + model + '…');
    ui.build.textContent = '…';
    try {
      spec = await ollamaBuild(text, model);
      source = model;
      note('');
    } catch (err) {
      note('ollama: ' + err.message + ' — built locally', 6000);
    }
  }
  if (!spec) spec = decompose(text);

  ui.build.disabled = false;
  ui.build.textContent = 'build';
  ui.prompt.focus();

  const c = addCohort(text, spec, source);
  focusCohort = c;
  renderRail();
  setTimeout(() => { if (focusCohort === c) { focusCohort = null; renderRail(); } }, 2600);
  save();
});

ui.prompt.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('form').requestSubmit();
  }
});

document.getElementById('inspect-close').onclick = () => select(null);
document.getElementById('pause').onclick = e => {
  paused = !paused;
  e.target.textContent = paused ? 'resume' : 'pause';
};
document.getElementById('clear').onclick = () => {
  agents.length = 0; cohorts.length = 0; chain.length = 0; usedNames.clear();
  selected = hovered = focusCohort = null;
  epoch = 0; births = 0; deaths = 0; cleared = 0; simAcc = 0; taskHeat = 0;
  refineQ.length = 0;
  ui.log.innerHTML = '';
  ui.event.textContent = '';
  try { localStorage.removeItem(STORE_KEY); } catch (_) {}
  select(null); relayout(); renderRail();
  if (genome.runs) logEvent('sandbox cleared · library from ' + genome.runs + ' runs kept', KINDS.meta.hue);
};
document.getElementById('forget').onclick = () => {
  genome = FRESH_GENOME();
  try { localStorage.removeItem(GENOME_KEY); } catch (_) {}
  inboxUnread = 0;
  logEvent('library forgotten — the next run starts from nothing', 0);
  renderInbox();
  updateHud();
};

document.getElementById('export').onclick = () => {
  const live = agents.filter(a => !a.dying);
  const ix = new Map(live.map((a, i) => [a, i]));
  const data = {
    exported: new Date().toISOString(),
    epoch, births, deaths, cleared,
    genome: { runs: genome.runs, doctrine: genome.doctrine, strains: genome.strains, history: genome.history },
    cohorts: cohorts.map(c => ({ prompt: c.prompt, source: c.source, built: c.count })),
    agents: live.map(a => ({
      rank: a.rank, name: a.name, kind: a.kind, role: a.role, depth: a.depth, builtFor: a.builtFor || null,
      gen: a.gen, fitness: +a.fit.toFixed(3), runs: a.runs, wins: a.wins,
      traits: a.skill, refined: !!a.refined,
      parent: a.parent ? a.parent.name : null,
      descendedFrom: a.sire ? a.sire.name : null,
      cohort: cohorts.indexOf(a.cohort)
    }))
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const el = document.createElement('a');
  el.href = url; el.download = 'agent-vortex.json'; el.click();
  URL.revokeObjectURL(url);
};

document.getElementById('c-spin').oninput = e => { spin = e.target.value / 100; };
document.getElementById('c-tilt').oninput = e => { tilt = e.target.value / 100; };
document.getElementById('c-glow').oninput = e => { glowScale = e.target.value / 100; };
document.getElementById('sim-speed').onchange = e => { simSpeed = +e.target.value; };
document.getElementById('order-mode').onchange = e => { orderMode = e.target.value; relayout(); };
document.getElementById('evolve').onchange = e => { evolveText = e.target.checked; };

addEventListener('keydown', e => {
  if (e.key === 'Escape') { select(null); focusCohort = null; renderRail(); }
  if (e.key === ' ' && document.activeElement !== ui.prompt) {
    e.preventDefault();
    document.getElementById('pause').click();
  }
});

/* ---------- the sandbox survives a reload ---------- */

function save() {
  try {
    const live = agents.filter(a => !a.dying);
    const ix = new Map(live.map((a, i) => [a, i]));
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v: 1, epoch, births, deaths, cleared,
      cohorts: cohorts.map(c => ({
        prompt: c.prompt, source: c.source, at: +c.at, hue: c.hue, count: c.count, mix: c.mix,
        work: c.work, done: c.done, bornEpoch: c.bornEpoch, clearedEpoch: c.clearedEpoch, run: c.run
      })),
      agents: live.map(a => ({
        name: a.name, kind: a.kind, role: a.role, depth: a.depth, core: !!a.core, builtFor: a.builtFor || null,
        gen: a.gen, fit: +a.fit.toFixed(4), runs: a.runs, wins: a.wins,
        skill: a.skill, refined: !!a.refined,
        cohort: cohorts.indexOf(a.cohort),
        parent: a.parent && ix.has(a.parent) ? ix.get(a.parent) : null,
        sire: a.sire && ix.has(a.sire) ? ix.get(a.sire) : null
      }))
    }));
  } catch (_) { /* private mode, quota, whatever — not worth interrupting for */ }
}

function load() {
  let d;
  try { d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (_) { return false; }
  if (!d || !Array.isArray(d.agents) || !d.agents.length) return false;

  epoch = d.epoch || 0; births = d.births || 0; deaths = d.deaths || 0; cleared = d.cleared || 0;
  for (const c of (d.cohorts || [])) {
    cohorts.push({
      id: cohorts.length, prompt: c.prompt, source: c.source,
      at: new Date(c.at || Date.now()), hue: c.hue, count: c.count || 0, mix: c.mix || {},
      work: c.work || 0, done: c.done || 0, bornEpoch: c.bornEpoch || 0,
      clearedEpoch: c.clearedEpoch === undefined ? null : c.clearedEpoch,
      run: reviveRun(c.run)
    });
  }
  if (!cohorts.length) return false;

  const now = performance.now();
  d.agents.forEach((a, i) => {
    usedNames.add(a.name);
    push({
      name: a.name,
      kind: KINDS[a.kind] ? a.kind : 'synthesize',
      role: a.role, depth: a.depth || 0, core: !!a.core, builtFor: a.builtFor || null,
      gen: a.gen || 1, fit: a.fit, runs: a.runs || 0, wins: a.wins || 0,
      skill: a.skill, refined: !!a.refined,
      cohort: cohorts[a.cohort] || cohorts[0],
      born: now + i * 14
    });
  });
  d.agents.forEach((a, i) => {
    if (a.parent != null && agents[a.parent]) { agents[i].parent = agents[a.parent]; agents[a.parent].kids.push(agents[i]); }
    if (a.sire != null && agents[a.sire]) agents[i].sire = agents[a.sire];
  });
  for (const a of agents) {
    if (a.depth > 0 && !a.parent) reseat(a, 0);   // owner did not survive the save
  }
  logEvent('resumed · ' + agents.length + ' agents, epoch ' + epoch, 0);
  return true;
}

setInterval(() => { save(); saveGenome(); }, 6000);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* seed prompts */
const SEEDS = [
  'watch my inbox, pull out the tasks, draft replies, file the receipts',
  'cut long videos into short clips, caption them, pick the best three',
  'scrape competitor pricing nightly, diff it, alert me on a drop'
];
for (const s of SEEDS) {
  const el = document.createElement('span');
  el.className = 'seed';
  el.textContent = s.split(',')[0] + '…';
  el.title = s;
  el.onclick = () => { ui.prompt.value = s; ui.prompt.focus(); };
  document.getElementById('seeds').appendChild(el);
}

/* ollama detection — unavailable for file previews */
(async () => {
  if (location.protocol === 'file:') return;
  const models = await ollamaTags(1800);
  if (!models || !models.length) return;
  const sel = document.getElementById('model');
  for (const m of models) {
    const o = document.createElement('option');
    o.value = o.textContent = m;
    sel.appendChild(o);
  }
  sel.disabled = false;
  document.getElementById('use-llm').disabled = false;
  document.getElementById('evolve').disabled = false;
  document.getElementById('builder').classList.remove('off');
})();

/* boot */
resize();
loadGenome();
if (genome.runs) {
  logEvent('library from ' + genome.runs + ' run' + (genome.runs > 1 ? 's' : '') +
    ' \u00b7 founders start at ' + genome.doctrine.startFit.toFixed(2) +
    ' \u00b7 learning \u00d7' + genome.doctrine.learnBonus.toFixed(2), KINDS.meta.hue);
}
renderInbox();
if (!load()) addCohort(SEEDS[1], decompose(SEEDS[1]), 'local');
relayout();
renderRail();
requestAnimationFrame(frame);
</script>
