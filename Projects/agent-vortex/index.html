<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent vortex</title>
<style>
  :root { color-scheme: dark; --ink:#d7d9dc; --dim:#777b82; --line:#303238; --bg:#050506; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  #stage { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; z-index:1; top:24px; left:26px; width:210px; text-shadow:0 1px 3px #000; pointer-events:none; }
  h1 { margin:0 0 14px; color:#f0f1f2; font-size:15px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; }
  h1 span { color:#555960; }
  .stat { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dotted var(--line); color:var(--dim); }
  .stat b { color:var(--ink); font-weight:400; }
  #status { margin-top:14px; color:var(--dim); }
  #controls { position:fixed; z-index:1; left:26px; right:26px; bottom:22px; }
  #form { display:flex; align-items:center; gap:10px; border-top:1px dotted #555960; padding-top:13px; }
  #prompt { min-width:0; flex:1; border:0; outline:0; background:transparent; color:#f0f1f2; font:inherit; font-size:14px; }
  #prompt::placeholder { color:#777b82; }
  button, select { border:1px solid #555960; border-radius:0; background:rgba(12,13,15,.82); color:var(--ink); font:inherit; padding:7px 10px; }
  button { cursor:pointer; }
  button:hover { background:#25272b; }
  #options { display:flex; align-items:center; gap:18px; border-top:1px dotted var(--line); margin-top:12px; padding-top:8px; color:var(--dim); }
  #options label { display:flex; align-items:center; gap:6px; }
  #selected { position:fixed; z-index:1; display:none; pointer-events:none; color:#b9bdc2; background:rgba(5,5,6,.85); padding:3px 5px; }
  @media (max-width:700px) {
    #hud { top:14px; left:14px; width:180px; }
    #hud .stat:nth-of-type(n+3), #status { display:none; }
    #controls { left:14px; right:14px; bottom:12px; }
    #options { gap:10px; flex-wrap:wrap; }
    #prompt { font-size:12px; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="animated agent vortex"></canvas>
<section id="hud" aria-live="polite">
  <h1>agent <span>/</span> vortex</h1>
  <div class="stat"><span>agents</span><b id="agent-count">0</b></div>
  <div class="stat"><span>epoch</span><b id="epoch">0</b></div>
  <div class="stat"><span>brief</span><b id="brief">—</b></div>
  <div class="stat"><span>fps</span><b id="fps">—</b></div>
  <div id="status">describe a job to build its agents</div>
</section>
<section id="controls">
  <form id="form" autocomplete="off">
    <span aria-hidden="true">›</span>
    <input id="prompt" autofocus placeholder="describe a job — it gets built into mini agents">
    <button id="build" type="submit">build</button>
  </form>
  <div id="options">
    <label>run <select id="speed"><option value="0" selected>hold</option><option value="1">1×</option><option value="4">4×</option></select></label>
    <button id="pause" type="button">pause</button>
    <button id="reset" type="button">reset</button>
  </div>
</section>
<div id="selected"></div>
<script>
'use strict';

const TAU = Math.PI * 2;
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const grain = document.createElement('canvas');
const grainCtx = grain.getContext('2d');
const ui = {
  count: document.getElementById('agent-count'), epoch: document.getElementById('epoch'),
  brief: document.getElementById('brief'), fps: document.getElementById('fps'),
  status: document.getElementById('status'), prompt: document.getElementById('prompt'),
  speed: document.getElementById('speed'), pause: document.getElementById('pause'),
  selected: document.getElementById('selected')
};
const state = {
  agents: [], epoch: 0, speed: 0, paused: false, time: 0,
  width: 0, height: 0, dpr: 1, grainScale: 3,
  field: new Uint8ClampedArray(0), windX: 0, windY: 0,
  pointerX: 0, pointerY: 0, pointerAt: 0, selected: null, brief: ''
};
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

function resize() {
  state.width = innerWidth; state.height = innerHeight;
  state.dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(state.width * state.dpr);
  canvas.height = Math.round(state.height * state.dpr);
  canvas.style.width = state.width + 'px'; canvas.style.height = state.height + 'px';
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  grain.width = Math.ceil(state.width / state.grainScale);
  grain.height = Math.ceil(state.height / state.grainScale);
  state.field = new Uint8ClampedArray(grain.width * grain.height);
}
addEventListener('resize', resize);

function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
function lerp(a, b, amount) { return a + (b - a) * amount; }
function hash(value) { const x = Math.sin(value * 12.9898) * 43758.5453; return x - Math.floor(x); }
function slug(text) { return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 20) || 'task'; }

function splitBrief(text) {
  return text.split(/\n+|\s*[;,|]\s*|\s+(?:and then|then|and|next|plus)\s+/i)
    .map(part => part.trim()).filter(Boolean).slice(0, 8);
}

function build(text) {
  const clauses = splitBrief(text);
  const parts = clauses.length ? clauses : [text.trim() || 'new task'];
  const base = slug(parts[0]);
  state.agents = parts.map((role, index) => ({
    id: index, name: index ? base + '.' + slug(role) : 'control.' + base,
    role, depth: index ? 1 : 0, parent: index ? null : undefined,
    seed: index * 19.37 + hash(text.length + index), age: 0,
    fit: .45 + hash(index + text.length) * .45, x: 0, y: 0, phase: hash(index + 3) * TAU
  }));
  for (let i = 1; i < state.agents.length; i++) {
    state.agents[i].parent = state.agents[Math.floor((i - 1) / 2)];
  }
  state.brief = text.trim() || 'new task'; state.epoch = 0; state.selected = null;
  ui.brief.textContent = state.brief.length > 22 ? state.brief.slice(0, 21) + '…' : state.brief;
  ui.status.textContent = 'built ' + state.agents.length + ' agents from a brief';
  updateHud();
}

function reset() {
  state.agents = []; state.epoch = 0; state.brief = ''; state.selected = null;
  state.paused = false; state.speed = 0; ui.pause.textContent = 'pause'; ui.speed.value = '0';
  ui.prompt.value = '';
  ui.brief.textContent = '—'; ui.status.textContent = 'describe a job to build its agents';
  updateHud();
}

function flowPoint(t, phase, lobe = 0) {
  const top = state.height * .10;
  const availableHeight = Math.max(180, state.height - 210);
  const radiusMax = Math.min(state.width * .38, availableHeight * .34);
  const taper = Math.pow(1 - t, 1.03);
  const lobePhase = phase + lobe * TAU / 3;
  const lean = Math.sin(state.time * .16 + t * 2.7 + lobePhase) * (14 + 34 * taper);
  const center = state.width * (.55 + .05 * Math.sin(lobePhase + state.time * .12));
  const radius = radiusMax * (.16 + .84 * taper) * (1 + .16 * Math.sin(lobePhase * 2.1 + t * 5));
  const angle = lobePhase + state.time * (.24 + t * t * 1.7) + t * TAU * (0.78 + .18 * Math.sin(lobePhase * 1.7));
  return {
    x: center + lean + Math.cos(angle) * radius + state.windX * (10 + t * 28),
    y: top + t * availableHeight + Math.sin(angle) * radius * (.18 + taper * .32) + state.windY * (8 + t * 22),
    radius
  };
}

function fieldPoint(agent, index) {
  const t = state.agents.length < 2 ? .5 : index / (state.agents.length - 1);
  const p = flowPoint(t, agent.phase, index % 3);
  const parent = agent.parent;
  if (!parent) return { x: p.x, y: p.y, t, radius: p.radius, depth: agent.depth };
  return {
    x: lerp(p.x, parent.x, .16),
    y: lerp(p.y, parent.y, .12),
    t, radius: p.radius, depth: agent.depth
  };
}

function addGrain(x, y, amount) {
  const gx = Math.floor(x / state.grainScale), gy = Math.floor(y / state.grainScale);
  if (gx < 0 || gy < 0 || gx >= grain.width || gy >= grain.height) return;
  const index = gy * grain.width + gx;
  state.field[index] = Math.min(255, state.field[index] + amount);
}

function addStreamline(baseAngle, phaseOffset) {
  for (let step = 0; step < 100; step++) {
    const t = step / 99;
    const p = flowPoint(t, baseAngle, Math.round(baseAngle / TAU * 3) % 3);
    addGrain(p.x, p.y, 120);
    addGrain(p.x + Math.sin(t * TAU * 2 + baseAngle) * 5, p.y, 70);
  }
}

function addEdge(from, to) {
  for (let step = 1; step < 26; step++) {
    const t = step / 26, bend = Math.sin(t * Math.PI) * 18;
    addGrain(lerp(from.x, to.x, t) + bend, lerp(from.y, to.y, t), 170);
  }
}

function paint() {
  const image = grainCtx.createImageData(grain.width, grain.height);
  for (let i = 0; i < state.field.length; i++) {
    const level = state.field[i];
    const x = i % grain.width, y = Math.floor(i / grain.width);
    const on = level > 28 + BAYER[(x % 4) + (y % 4) * 4] * 11;
    const value = on ? level : 0;
    image.data[i * 4] = value; image.data[i * 4 + 1] = value;
    image.data[i * 4 + 2] = value; image.data[i * 4 + 3] = value;
  }
  grainCtx.putImageData(image, 0, 0);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = .2;
  ctx.filter = 'blur(7px)';
  ctx.drawImage(grain, 0, 0, state.width, state.height);
  ctx.restore();
  ctx.filter = 'none';
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  ctx.drawImage(grain, 0, 0, state.width, state.height);
}

function render() {
  ctx.clearRect(0, 0, state.width, state.height);
  ctx.fillStyle = '#050506'; ctx.fillRect(0, 0, state.width, state.height);
  state.field.fill(0);
  for (let i = 0; i < 34; i++) addStreamline(i / 34 * TAU, Math.sin(i * 3.7) * .22);
  state.agents.forEach((agent, index) => { const p = fieldPoint(agent, index, state.time); agent.x = p.x; agent.y = p.y; agent._p = p; });
  for (const agent of state.agents) if (agent.parent) addEdge(agent.parent, agent);
  for (const agent of state.agents) {
    const p = agent._p, grains = agent.depth ? 18 : 28, radius = agent.depth ? 7 : 10;
    for (let n = 0; n < grains; n++) {
      const angle = hash(agent.seed + n) * TAU, distance = hash(agent.seed + n * 2.3) * radius;
      addGrain(p.x + Math.cos(angle) * distance, p.y + Math.sin(angle) * distance * .65, 180);
    }
  }
  paint();
  for (const agent of state.agents) {
    const split = Math.min(.8, Math.abs(state.windX) * .7 + Math.abs(state.windY) * .35);
    if (split > .02) {
      ctx.fillStyle = 'rgba(255,0,0,.35)'; ctx.fillRect(agent.x - split, agent.y, 1, 1);
      ctx.fillStyle = 'rgba(0,0,255,.35)'; ctx.fillRect(agent.x + split, agent.y, 1, 1);
    }
  }
  if (state.selected) {
    ui.selected.textContent = state.selected.name;
    ui.selected.style.display = 'block'; ui.selected.style.left = state.selected.x + 12 + 'px'; ui.selected.style.top = state.selected.y + 8 + 'px';
  } else ui.selected.style.display = 'none';
}

function updateHud() { ui.count.textContent = state.agents.length; ui.epoch.textContent = state.epoch; }
function tick(now) {
  const dt = Math.min(.05, (now - (tick.last || now)) / 1000); tick.last = now;
  if (!state.paused) {
    state.time += dt;
    if (state.speed) state.epoch += dt * state.speed;
    state.windX *= Math.pow(.04, dt); state.windY *= Math.pow(.04, dt);
  }
  render();
  tick.frames = (tick.frames || 0) + 1; tick.elapsed = (tick.elapsed || 0) + dt;
  if (tick.elapsed > .5) { ui.fps.textContent = Math.round(tick.frames / tick.elapsed); tick.frames = 0; tick.elapsed = 0; updateHud(); }
  requestAnimationFrame(tick);
}

function pointerMove(event) {
  const now = performance.now(), elapsed = Math.max(16, now - state.pointerAt);
  if (state.pointerAt) {
    state.windX = clamp((event.clientX - state.pointerX) / elapsed * 8, -1, 1);
    state.windY = clamp((event.clientY - state.pointerY) / elapsed * 8, -1, 1);
  }
  state.pointerX = event.clientX; state.pointerY = event.clientY; state.pointerAt = now;
}
function pick(x, y) {
  return state.agents.reduce((best, agent) => Math.hypot(agent.x - x, agent.y - y) < Math.hypot((best || {x:1e5,y:1e5}).x - x, (best || {x:1e5,y:1e5}).y - y) ? agent : best, null);
}

ui.speed.addEventListener('change', () => { state.speed = Number(ui.speed.value); });
ui.pause.addEventListener('click', () => { state.paused = !state.paused; ui.pause.textContent = state.paused ? 'resume' : 'pause'; });
document.getElementById('reset').addEventListener('click', reset);
document.getElementById('form').addEventListener('submit', event => {
  event.preventDefault();
  if (!ui.prompt.value.trim()) { ui.status.textContent = 'enter a job before building'; return; }
  build(ui.prompt.value);
});
canvas.addEventListener('pointermove', pointerMove);
canvas.addEventListener('click', event => { const hit = pick(event.clientX, event.clientY); state.selected = hit && Math.hypot(hit.x - event.clientX, hit.y - event.clientY) < 28 ? hit : null; });
resize(); updateHud(); requestAnimationFrame(tick);
</script>
</body>
</html>
